# Env definition file for creating environment via conda

name: cmatools-tests-env
channels:
  # make sure conda-main is not listed here (MO-L)
  - conda-forge
  - nodefaults
dependencies:
 - python=3.9
 - iris>=3.0
 - black
 - pre-commit
 - pydap
 - isort
 - flake8
 - nccmp
 - coverage
 - pytest
 - pytest-cov
 - cdsapi
 - humanize
 - pip
