# Env definition file for creating environment via conda

name: cmatools-docs-env
channels:
  # make sure conda-main is not listed here (MO-L)
  - conda-forge
  - nodefaults
dependencies:
 - python=3.9
 - iris>=3.0
 - numpy>=1.19
 - black
 - pre-commit
 - isort
 - flake8
 - myst-parser
 - sphinx
 - sphinx_rtd_theme
 - sphinx-argparse
 - sphinx-gallery
 - sphinxcontrib-mermaid
 - numpydoc
 - pipreqs
 - pip
